function resolvedAppShareUrl(){
  if(APP_SHARE_URL){
    return APP_SHARE_URL;
  }

  try{
    const url=new URL(location.href);
    url.search='';
    url.hash='';

    if(url.protocol==='http:'||url.protocol==='https:'){
      return url.href;
    }
  }catch(_){}

  return '';
}

function fallbackCopyShareUrl(url){
  if(!url)return false;

  const input=document.createElement('textarea');
  input.value=url;
  input.setAttribute('readonly','');
  input.style.position='fixed';
  input.style.opacity='0';
  document.body.appendChild(input);
  input.select();

  let copied=false;
  try{copied=document.execCommand('copy');}catch(_){copied=false;}
  input.remove();
  return copied;
}

async function shareApp(){
  closeDrawer();
  const url=resolvedAppShareUrl();

  if(!url){
    toast(tr('share.unavailable'));
    return;
  }

  const payload={title:tr('app.title'),text:tr('share.text'),url};

  try{
    if(typeof navigator.share==='function'){
      await navigator.share(payload);
      return;
    }

    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(url);
      toast(tr('share.copied'));
      return;
    }

    if(fallbackCopyShareUrl(url)){
      toast(tr('share.copied'));
      return;
    }

    toast(tr('share.unavailable'));
  }
  catch(err){
    if(err?.name==='AbortError')return;
    console.error(err);
    toast(tr('share.unavailable'));
  }
}


function legalUrl(type){
  const loc=LEGAL_URLS[locale()]?locale():'en-US';
  return LEGAL_URLS[loc]?.[type]||'';
}

function openLegalUrl(type){
  const raw=legalUrl(type);
  let target;
  try{target=new URL(raw);}catch(_){toast(tr('legal.externalUnavailable'));return;}
  if(target.protocol!=='https:'){toast(tr('legal.externalUnavailable'));return;}
  if(navigator.onLine===false){toast(tr('legal.externalUnavailable'));return;}
  const link=document.createElement('a');
  link.href=target.href;
  link.target='_blank';
  link.rel='noopener noreferrer external';
  link.referrerPolicy='no-referrer';
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function openAdvertisingPrivacyChoices(){
  try{
    const native=window.ReactNativeWebView;
    if(native&&typeof native.postMessage==='function'){
      native.postMessage(JSON.stringify({type:'privacy-choices'}));
      return;
    }
    const iosHandler=window.webkit?.messageHandlers?.openPrivacyChoices;
    if(iosHandler&&typeof iosHandler.postMessage==='function'){
      iosHandler.postMessage({source:'settings-legal'});
      return;
    }
    const androidHandler=window.AndroidPrivacyBridge;
    if(androidHandler&&typeof androidHandler.openPrivacyChoices==='function'){
      androidHandler.openPrivacyChoices();
      return;
    }
  }catch(err){
    console.error('[GBT] Privacy choices bridge failed',err);
  }
  openModal(`<div class="modal-head"><h2>${tr('legal.privacyChoices')}</h2>${closeButton()}</div><p>${tr('legal.privacyChoicesUnavailable')}</p><button data-action="close-modal" class="btn full secondary">${tr('common.done')}</button>`,'privacy-choices-info');
}

function syncDeviceLocale({rerender=true}={}){const next=resolveInitialLocale();if(state.settings.language===next)return false;state.settings.language=next;persist();applyLocaleToDocument();if(rerender)renderApp();return true;}
function setRoute(name,{replaceHistory=false}={}){
  const allowed=[
    'home',
    'shop',
    'history',
    'cards',
    'saved',
    'removeAds',
    'settings',
    'help'
  ];

  const requested=allowed.includes(name)?name:'home';
  const needsShoppingSetup=requested==='shop'&&!shoppingSetupReady();
  const destination=needsShoppingSetup?'cards':requested;
  if(!replaceHistory&&state.route&&state.route!==destination)routeHistory.push(state.route);
  state.route=destination;
  persist();
  closeDrawer();
  renderApp();

  if(needsShoppingSetup)requestAnimationFrame(()=>toast(tr('home.addFundingBody')));

  requestAnimationFrame(()=>{
    el('main')?.scrollTo({
      top:0,
      behavior:'instant'
    });
  });
}
function handleAndroidBack(){
 if(routeHistory.length){const previous=routeHistory.pop();setRoute(previous,{replaceHistory:true});return true;}
 if(state.route!=='home'){setRoute('home',{replaceHistory:true});return true;}
 return false;
}
window.GBTAndroidBack=handleAndroidBack;

 const item=buildBasketItemFromDraft(d,valid),next=C.clone(state),idx=next.basket.items.findIndex(i=>i.id===item.id),learnedBarcode=String(d.pendingBarcode||'');
 if(idx>=0)next.basket.items[idx]=item;else next.basket.items.push(item);
 next.basket.transactionDate=today();
 if(next.basket.store){const st=R.normalizeStore(next.basket.store);next.basket.store=st.storeDisplayName;next.recentStores=[st.storeDisplayName,...next.recentStores.filter(x=>R.normalizeStore(x).storeNormalizedKey!==st.storeNormalizedKey)].slice(0,40);}

document.addEventListener('click',event=>{
 const button=event.target?.closest?.('[data-action]');if(!button)return;const action=button.dataset.action;
 const intercept=()=>{event.preventDefault();event.stopImmediatePropagation();};
 if(action==='confirm-store'){intercept();void (async()=>{const value=String(storeDraft||el('storeInput')?.value||'').trim();if(!value){setFieldError('storeInput',R.PARSE_ERROR.REQUIRED);focusFirstError();return;}const next=C.clone(state),store=R.normalizeStore(value);next.basket.store=store.storeDisplayName;next.recentStores=[store.storeDisplayName,...next.recentStores.filter(x=>R.normalizeStore(x).storeNormalizedKey!==store.storeNormalizedKey)].slice(0,40);next.entryDrafts={...(next.entryDrafts||{}),store:null};if(await commitCritical(next)){storeDraft='';renderShop();}})();}
 else if(action==='change-store'){intercept();void (async()=>{const next=C.clone(state);storeDraft=next.basket.store||'';next.basket.store='';next.entryDrafts={...(next.entryDrafts||{}),store:{value:storeDraft}};if(await commitCritical(next))renderShop();})();}
 else if(action==='clear-basket'){intercept();openModal(`<div class="modal-head"><h2>${tr('shop.clearBasket')}</h2>${closeButton()}</div><p>${tr('shop.clearBasketBody',{count:state.basket.items.length})}</p><button type="button" data-action="confirm-clear-basket" class="danger-btn full">${tr('shop.clearBasket')}</button>`,'clear-basket');}
 else if(action==='confirm-clear-basket'){intercept();void (async()=>{const next=C.clone(state);lastClearedBasket=C.clone(next.basket);next.basket={store:next.basket.store,transactionDate:today(),items:[]};if(await commitCritical(next)){closeModal();renderShop();}else lastClearedBasket=null;})();}
 else if(action==='undo-clear-basket'){intercept();void (async()=>{if(!lastClearedBasket)return;const next=C.clone(state);next.basket=C.clone(lastClearedBasket);if(await commitCritical(next)){lastClearedBasket=null;renderShop();}})();}
 else if(action==='undo-basket-replace'){intercept();void (async()=>{if(!lastReplacedBasket)return;const next=C.clone(state);next.basket=C.clone(lastReplacedBasket);if(await commitCritical(next)){lastReplacedBasket=null;toast(tr('saved.undoReplace'));renderApp();}})();}
 else if(action==='apply-history-basket'){intercept();void applyHistoryBasket(button.dataset.tx,button.dataset.mode);}
 else if(action==='void-history'){intercept();confirmVoidHistory(button.dataset.tx);}
 else if(action==='confirm-void-history'){intercept();void applyVoidHistory(button.dataset.tx);}
 else if(action==='success-shop'){intercept();closeModal();setRoute('home');}
 else if(action==='rollover-carry'||action==='rollover-discard'){intercept();void (async()=>{const next=C.applyRolloverChoice(state,action==='rollover-carry'?'carry':'discard');if(await commitCritical(next)){closeModal();rolloverPromptShown=false;processRuntimeTransitions();renderApp();}})();}
 else if(action==='toggle-program'){intercept();void (async()=>{const program=button.dataset.value,enabled=new Set(state.settings.enabledPrograms||[]),disabling=enabled.has(program),inUse=state.basket.items.some(item=>{const mode=item.funding?.mode;return program==='SNAP'&&(mode==='SNAP'||mode==='SPLIT'||item.funding?.remainderType==='SNAP')||program==='WIC'&&mode==='WIC';});if(disabling&&inUse){toast(tr('cards.sourceInUse'));return;}disabling?enabled.delete(program):enabled.add(program);const next=C.clone(state);next.settings.enabledPrograms=[...enabled];next.settings.enabledProgramsChosen=true;if(await commitCritical(next))renderSettings();})();}
 else if(action==='set-funding'){intercept();syncShopDraftFromDom();const d=ensureShopDraft(),mode=button.dataset.value;d.fundingMode=mode;if(mode==='SNAP'){const cards=C.getActiveSnapCards(state);if(cards.length===1)d.snapCardId=cards[0].id;}if(mode==='WIC'){const rows=wicCandidateRows(d);if(rows.length===1){d.wicCardId=rows[0].card.id;d.allowanceId=rows[0].allowance.id;d.wicQuantityRaw=rows[0].allowance.unit===d.quantityUnit?d.quantityRaw:'';}}scheduleDraftPersistence('shop',d);renderShop();}
 else if(['save-cash-budget','confirm-cash-timing','apply-cash-new-period'].includes(action)){const parsed=parseEntryMoney(String(el('cashBaseBudget')?.value??cashEditDraft?.amountRaw??''));if(parsed.ok&&parsed.value<=0){intercept();setFieldError('cashBaseBudget',R.PARSE_ERROR.OUT_OF_RANGE);toast(tr('budget.zeroNotConfigured'));}}
 else if(action==='delete-saved'){intercept();const saved=state.savedBaskets.find(x=>x.id===button.dataset.id);if(saved)openModal(`<div class="modal-head"><h2>${tr('common.delete')}</h2>${closeButton()}</div><p>${tr('saved.deleteConfirm',{name:savedDisplayName(saved,state.savedBaskets.indexOf(saved)+1)})}</p><button data-action="confirm-delete-saved" data-id="${saved.id}" class="danger-btn full">${tr('common.delete')}</button>`,'delete-saved');}
 else if(action==='toggle-snap-active'){const card=state.snapCards.find(c=>c.id===button.dataset.id),inUse=state.basket.items.some(item=>['SNAP','SPLIT'].includes(item.funding?.mode)&&item.funding?.snapCardId===card?.id||item.funding?.remainderSnapCardId===card?.id);if(card?.active!==false&&inUse){intercept();toast(tr('cards.sourceInUse'));}}
 else if(action==='toggle-wic-card-active'){const card=state.wicCards.find(c=>c.id===button.dataset.id),inUse=state.basket.items.some(item=>item.funding?.mode==='WIC'&&item.funding?.wicCardId===card?.id);if(card?.active!==false&&inUse){intercept();toast(tr('cards.sourceInUse'));}}
 else if(action==='toggle-wic-allowance-active'){const inUse=state.basket.items.some(item=>item.funding?.mode==='WIC'&&item.funding?.wicCardId===button.dataset.card&&item.funding?.allowanceId===button.dataset.id);if(inUse){intercept();toast(tr('cards.sourceInUse'));}}
 else if(action==='delete-unused-snap'){intercept();void (async()=>{const card=state.snapCards.find(c=>c.id===button.dataset.id);if(!card||historyUsesSource('SNAP',card.id)||(card.transactions||[]).length)return;const next=C.clone(state);next.snapCards=next.snapCards.filter(c=>c.id!==card.id);if(await commitCritical(next)){closeModal();renderCards();}})();}
 else if(action==='delete-unused-wic-card'){intercept();void (async()=>{const card=state.wicCards.find(c=>c.id===button.dataset.id);if(!card||historyUsesSource('WIC',card.id)||(card.transactions||[]).length||(card.allowances||[]).some(a=>(a.transactions||[]).length))return;const next=C.clone(state);next.wicCards=next.wicCards.filter(c=>c.id!==card.id);if(await commitCritical(next)){closeModal();renderCards();}})();}
 else if(action==='delete-unused-wic-allowance'){intercept();void (async()=>{const card=state.wicCards.find(c=>c.id===button.dataset.card),allowance=card?.allowances?.find(a=>a.id===button.dataset.id);if(!allowance||historyUsesSource('WIC',card.id,allowance.id)||(allowance.transactions||[]).length)return;const next=C.clone(state),target=next.wicCards.find(c=>c.id===card.id);target.allowances=target.allowances.filter(a=>a.id!==allowance.id);if(await commitCritical(next)){closeModal();renderCards();}})();}
},true);

document.addEventListener('change',event=>{
 const target=event.target;
 if(target?.id==='privacySetting'){event.stopImmediatePropagation();void (async()=>{const next=C.clone(state);next.settings.privacyEnabled=target.checked;if(await commitCritical(next)){privacyReveal=false;renderSettings();renderChrome();}})();}

 else if(target?.id==='languageSetting'){event.stopImmediatePropagation();void (async()=>{const next=C.clone(state);next.settings.language=target.value;if(await commitCritical(next)){applyLocaleToDocument();renderApp();}})();}
 else if(target?.id==='shopTransactionDate'){event.stopImmediatePropagation();const value=target.value,previous=state.basket.transactionDate||today();if(!validLocalDate(value)){target.value=previous;return;}if(state.basket.items.length&&!window.confirm(tr('shop.changeDateConfirm'))){target.value=previous;return;}void (async()=>{const next=C.clone(state);next.basket.transactionDate=value;if(await commitCritical(next)){const d=ensureShopDraft();d.transactionDate=value;scheduleDraftPersistence('shop',d);renderShop();}else target.value=previous;})();}
 else if(target?.id==='priceEntryMode'){event.stopImmediatePropagation();const d=ensureShopDraft();if(d.priceEntryMode!==target.value){d.priceEntryMode=target.value;d.priceKnown=false;d.priceRaw='';scheduleDraftPersistence('shop',d);}renderShop();}

const HISTORY_TRANSFER_FORMAT=APP_METADATA.transferFormat;
const HISTORY_TRANSFER_VERSION=R.TRANSFER_VERSION;
const HISTORY_IMPORT_MAX_BYTES=R.LIMITS.maxFileBytes;
let pendingHistoryImport=null;

function pendingHistoryCount(){return state.history.reduce((s,tx)=>s+(tx.items||[]).filter(i=>(i.allocations||[]).some(a=>a.type==='UNRESOLVED')).length,0);}
function txFundingTypes(tx){return [...new Set((tx.items||[]).flatMap(i=>(i.allocations||[]).map(a=>a.type)))];}
function historyTxMatches(tx,q){if(!q)return true;const query=normalizeSearch(q);return normalizeSearch(tx.store).includes(query)||(tx.items||[]).some(i=>itemSearchName(i).includes(query));}
function historyTransferHtml(){return `<div class="section-card"><div class="section-head"><div><h2>${tr('history.transferTitle')}</h2><small>${tr('history.transferBody')}</small></div></div><div class="button-row"><button data-action="history-export" class="btn secondary" ${state.history.length&&durableReady?'':'disabled'}>${tr('history.exportBackup')}</button><button data-action="history-import-pick" class="btn" ${durableReady?'':'disabled'}>${tr('history.importBackup')}</button></div><input id="historyImportFile" class="hidden" type="file" accept=".json,application/json"></div>${importBatchHistoryHtml()}`;}
let historyMode='ACTIVITY';

function renderHistory(){const toggle=`<div class="history-toggle"><button type="button" data-action="history-mode" data-value="ACTIVITY" class="${historyMode==='ACTIVITY'?'active':''}">${tr('stream.activity')}</button><button type="button" data-action="history-mode" data-value="INSIGHTS" class="${historyMode==='INSIGHTS'?'active':''}">${tr('stream.insights')}</button></div>`;if(historyMode==='INSIGHTS'){el('main').innerHTML=`<section class="page"><h1>${tr('nav.history')}</h1>${toggle}${historyInsightsHtml()}</section>`;return;}const rows=state.history||[];el('main').innerHTML=`<section class="page"><h1>${tr('nav.history')}</h1>${toggle}<details><summary>${tr('stream.filter')}</summary><div class="chips">${[['ALL',tr('history.all')],['SNAP',programLabel('SNAP')],['WIC','WIC'],['CASH',tr('funding.cash')]].map(([v,l])=>`<button data-action="history-filter" data-value="${v}" class="${historyFilters.funding===v?'active':''}">${l}</button>`).join('')}</div></details>${rows.length?`<div class="history-list">${rows.filter(tx=>historyFilters.funding==='ALL'||txFundingTypes(tx).includes(historyFilters.funding)).map(historyCardHtml).join('')}</div>`:`<div class="empty-state">${icon('history')}<b>${tr('stream.noActivity')}</b></div>`}</section>`;}
function historyInsightsHtml(){let snap=0,wic=0,cash=0;for(const tx of state.history||[])for(const item of tx.items||[])for(const a of item.allocations||[]){if(a.type==='SNAP')snap+=Number(a.amountCents||0);else if(a.type==='WIC')wic+=Number(a.amountCents||0);else if(a.type==='CASH')cash+=Number(a.amountCents||0);}return `<div class="metric-grid"><div><span>${tr('stream.snapUsed')}</span><b>${sensitiveMoney(snap)}</b></div><div><span>${tr('stream.wicUsed')}</span><b>${sensitiveMoney(wic)}</b></div><div><span>${tr('stream.cashSpent')}</span><b>${sensitiveMoney(cash)}</b></div><div><span>${tr('stream.purchases')}</span><b>${formatNumber(state.history.length,{maximumFractionDigits:0})}</b></div></div>`;}

function historyCardHtml(tx){const types=txFundingTypes(tx).map(fundingTypeLabel),pending=(tx.items||[]).filter(i=>(i.allocations||[]).some(a=>a.type==='UNRESOLVED')).length;return `<button class="history-card" data-action="open-history" data-id="${tx.id}"><div><b>${esc(displayStore(tx.store))}</b><small>${esc(formatDate(tx.transactionDate))} · ${keyedPlural('history.itemCount',tx.items.length)}</small><span>${esc(types.join(' · '))}</span>${tx.importedHistory?`<span>${tr('history.importedLabel')}</span>`:''}${pending?`<em>${tr('history.pendingAction')} <i>${formatNumber(pending,{maximumFractionDigits:0})}</i></em>`:''}</div><strong>${sensitiveMoney(tx.totalKnownCents)}${tx.unknownPriceCount?'<small> + ?</small>':''}</strong></button>`;}
function allocationLabel(a){if(a.type==='SNAP')return `${programLabel('SNAP')} ${sensitiveMoney(a.amountCents)}`;if(a.type==='CASH')return `${tr('funding.cash')} ${sensitiveMoney(a.amountCents)}`;if(a.type==='WIC'){const allow=wicAllowanceForAllocation(a),lab=allow?wicAllowanceLabel(allow):(a.wicBenefitLabel||'WIC');return `${lab}: ${a.unit==='$'?sensitiveMoney(a.amountCents):sensitiveQty(a.quantity,a.unit)}`;}return tr('common.pending');}
function openHistoryDetail(id){const tx=state.history.find(x=>x.id===id);if(!tx)return;openModal(`<div class="modal-head"><div><div class="eyebrow">${esc(formatDate(tx.transactionDate))}</div><h2>${esc(displayStore(tx.store))}</h2></div>${closeButton()}</div>${tx.importedHistory?`<div class="notice info">${tr('history.importedReadOnly')}</div>`:''}<button type="button" data-action="copy-history-basket" data-tx="${tx.id}" class="btn secondary full">${tr('common.load')} ${tr('nav.shop')}</button>${tx.importedHistory?'':`<button type="button" data-action="edit-transaction-details" data-tx="${tx.id}" class="btn secondary full">${tr('correction.details')}</button>`}<div class="history-detail">${tx.items.map(i=>{const name=itemDisplayName(i);return `<div class="history-item"><div><b>${esc(name)}</b><small>${i.priceKnown?(i.priceEntryMode==='LINE_TOTAL'&&Number.isSafeInteger(i.lineTotalCents)?`${formatNumber(i.quantity,{maximumFractionDigits:2})} · ${tr('shop.lineTotal')} ${sensitiveMoney(i.lineTotalCents)}`:`${formatNumber(i.quantity,{maximumFractionDigits:2})} × ${sensitiveMoney(i.unitPriceCents)}`):tr('shop.priceUnknownLower')}</small><span>${(i.allocations||[]).map(allocationLabel).map(esc).join(' · ')}</span></div>${tx.importedHistory?`<button data-action="delete-imported-history" data-tx="${tx.id}" class="small-btn">${tr('history.deleteImported')}</button>`:`<button data-action="correct-history-item" data-tx="${tx.id}" data-item="${i.id}">${tr('history.correct')}</button>`}</div>`;}).join('')}</div><div class="detail-total"><span>${tr('history.knownPriceTotal')}</span><b>${sensitiveMoney(tx.totalKnownCents)}</b></div>${tx.unknownPriceCount?`<div class="notice info">${keyedPlural('history.incompleteTotal',tx.unknownPriceCount)}</div>`:''}`,'history');}

function publicProductName(value){return R.isAcceptedProductName(value)?APP_METADATA.productName:String(value||APP_METADATA.productName);}

function handleInput(e){
  if(e.target.id==='storeInput'){
    storeDraft=e.target.value;
    scheduleDraftPersistence('store',{value:storeDraft});
    renderSuggestions('store',e.target.value);
  }
  else if(e.target.id==='itemInput'){
    const d=ensureShopDraft();
    d.name=e.target.value;
    d.catalogItemId=null;
    d.systemNameKey=null;
    scheduleDraftPersistence('shop',d);
    renderSuggestions('item',e.target.value);
  }
  else if(e.target.id==='itemBrandInput'){
    const d=ensureShopDraft();d.brand=e.target.value;scheduleDraftPersistence('shop',d);
  }
  else if(e.target.id==='shopPriceInput'){
    const d=ensureShopDraft();d.priceRaw=e.target.value;d.priceKnown=String(e.target.value).trim()!=='';d.priceEntryMode='UNIT_PRICE';scheduleDraftPersistence('shop',d);
  }
  else if(e.target.id==='quantityInput'){
    const d=ensureShopDraft();d.quantityRaw=e.target.value;scheduleDraftPersistence('shop',d);
  }
  else if(e.target.id==='wicQtyInput'){
    const d=ensureShopDraft();d.wicQuantityRaw=e.target.value;scheduleDraftPersistence('shop',d);
  }
  else if(String(e.target.id||'').startsWith('standaloneSaved')){
    captureSavedBasketDraft();
  }
  else if(e.target.id==='historySearch'){
    historyFilters.query=e.target.value;
    clearTimeout(historySearchTimer);
    historySearchTimer=setTimeout(()=>{
      if(state.route!=='history')return;
      renderHistory();
      const i=el('historySearch');
      if(i){
        i.focus();
        i.setSelectionRange(i.value.length,i.value.length);
      }
    },200);
  }

}

validateShopDraft=function(d){

 }else{
  if(!name)errors.push(['itemInput',R.PARSE_ERROR.REQUIRED]);const qty=parseEntryQuantity(String(quantityRaw||''),{allowZero:false,maxFractionDigits:inferredQuantityPrecision(quantityUnit)});if(!qty.ok)errors.push(['quantityInput',qty.code]);price=parseEntryMoney(String(d.priceRaw||''));if(!price.ok)errors.push(['shopPriceInput',price.code]);else d.priceKnown=true;if(d.fundingMode==='SNAP'){const cards=C.getActiveSnapCards(state);d.snapCardId=d.snapCardId||cards[0]?.id||'';if(!d.snapCardId)errors.push(['shopErrorSummary',R.PARSE_ERROR.REQUIRED]);if(d.splitEnabled&&price.ok&&qty.ok){const total=lineTotalFromDraft(d),snap=parseEntryMoney(String(d.snapPartRaw||'')),snapCents=snap.ok?Math.min(snap.value,total):total;d.snapPartRaw=R.centsToMoneyInput(snapCents);}}
