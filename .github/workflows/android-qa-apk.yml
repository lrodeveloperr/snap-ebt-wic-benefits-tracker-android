name: Android QA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-qa-apk:
    name: Build installable QA APK
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    concurrency:
      group: android-qa-apk-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_BUILD_PROFILE: qa
      EXPO_PUBLIC_AD_PROFILE: test
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_ANDROID_ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
      EXPO_PUBLIC_ANDROID_ADMOB_BANNER_ID: ca-app-pub-3940256099942544/6300978111

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify locked native dependency versions
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          const expected = {
            expo: "57.0.9",
            "react-native": "0.86.2",
            "react-native-webview": "14.0.1",
            "react-native-google-mobile-ads": "16.3.4",
            "expo-notifications": "57.0.10",
            "expo-iap": "5.2.4",
          };
          for (const [name, version] of Object.entries(expected)) {
            assert.equal(
              lock.packages?.[`node_modules/${name}`]?.version,
              version,
              `${name} must stay locked to ${version}`,
            );
          }
          assert.equal(pkg.dependencies.expo, "~57.0.9");
          assert.equal(pkg.dependencies["react-native"], "0.86.2");
          const adsPackage = require("./node_modules/react-native-google-mobile-ads/package.json");
          assert.equal(adsPackage.sdkVersions.android.googleMobileAds, "25.0.0");
          assert.equal(adsPackage.sdkVersions.android.googleUmp, "4.0.0");
          NODE

      - name: Prepare embedded app
        run: node scripts/embed-web-app.mjs

      - name: Validate source, types, and tests
        run: npm run validate:source

      - name: Verify resolved QA configuration
        shell: bash
        run: |
          npx expo config --type prebuild --json > "$RUNNER_TEMP/expo-config.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/expo-config.json", "utf8"));
          const buildProperties = config.plugins.find(
            (plugin) => Array.isArray(plugin) && plugin[0] === "expo-build-properties",
          );
          if (config.android.package !== "com.lateefrazaqoyetola.snapebtwictracker.qa") {
            throw new Error(`Unexpected QA package: ${config.android.package}`);
          }
          if (config.android.versionCode !== Number(process.env.ANDROID_VERSION_CODE)) {
            throw new Error(`Unexpected versionCode: ${config.android.versionCode}`);
          }
          const androidBuild = buildProperties?.[1]?.android;
          if (
            androidBuild?.minSdkVersion !== 24 ||
            androidBuild?.compileSdkVersion !== 36 ||
            androidBuild?.targetSdkVersion !== 36 ||
            androidBuild?.buildToolsVersion !== "36.0.0"
          ) {
            throw new Error("Unexpected resolved Android SDK configuration.");
          }
          if (
            config.name !== "Grocery Benefits Tracker QA" ||
            config.extra?.buildProfile !== "qa" ||
            JSON.stringify(config.platforms) !== JSON.stringify(["android"])
          ) {
            throw new Error("Unexpected resolved QA application metadata.");
          }
          if (!config.android.permissions.includes("android.permission.POST_NOTIFICATIONS")) {
            throw new Error("Android reminder notification permission is missing.");
          }
          const ads = config.plugins.find(
            (plugin) => Array.isArray(plugin) && plugin[0] === "react-native-google-mobile-ads",
          );
          if (ads?.[1]?.androidAppId !== "ca-app-pub-3940256099942544~3347511713") {
            throw new Error("QA config does not use Google's demo AdMob app ID.");
          }
          if (
            process.env.EXPO_PUBLIC_ANDROID_ADMOB_BANNER_ID !==
            "ca-app-pub-3940256099942544/6300978111"
          ) {
            throw new Error("QA config does not use Google's fixed Android demo banner ID.");
          }
          NODE

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Verify generated Android project
        run: node scripts/verify-android.mjs

      - name: Make generated release artifact unsigned
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const file = "android/app/build.gradle";
          let source = fs.readFileSync(file, "utf8");
          const releaseMarker = "        release {";
          const releaseStart = source.indexOf(releaseMarker);
          if (releaseStart < 0 || source.indexOf(releaseMarker, releaseStart + 1) >= 0) {
            throw new Error("Expected exactly one generated release build block.");
          }
          const prefix = source.slice(0, releaseStart);
          let releaseAndRemainder = source.slice(releaseStart);
          const signingLine = /^\s*signingConfig\s*=\s*signingConfigs\.debug\s*$/gm;
          const occurrences = [...releaseAndRemainder.matchAll(signingLine)].length;
          if (occurrences !== 1) {
            throw new Error(`Expected one generated release debug signing line; found ${occurrences}.`);
          }
          releaseAndRemainder = releaseAndRemainder.replace(signingLine, "");
          source = prefix + releaseAndRemainder;
          fs.writeFileSync(file, source);
          NODE

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify resolved Google ads SDKs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :react-native-google-mobile-ads:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon | tee "$RUNNER_TEMP/google-ads-dependencies.txt"
          grep -F "com.google.android.gms:play-services-ads:25.0.0" \
            "$RUNNER_TEMP/google-ads-dependencies.txt"
          grep -F "com.google.android.ump:user-messaging-platform:4.0.0" \
            "$RUNNER_TEMP/google-ads-dependencies.txt"
          if grep -F "com.google.android.gms:play-services-ads:25.4.0" \
            "$RUNNER_TEMP/google-ads-dependencies.txt"; then
            echo "Incompatible Google Mobile Ads 25.4.0 was resolved." >&2
            exit 1
          fi

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Validate and stage installable APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_apks=(android/app/build/outputs/apk/release/*-unsigned.apk)
          if (( ${#release_apks[@]} != 1 )); then
            echo "Expected one unsigned release APK; found ${#release_apks[@]}." >&2
            exit 1
          fi
          source_apk="${release_apks[0]}"

          mkdir -p dist
          final_apk="dist/grocery-benefits-tracker-qa.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          aligned_apk="$RUNNER_TEMP/grocery-benefits-tracker-qa-aligned.apk"
          qa_keystore="$RUNNER_TEMP/grocery-benefits-tracker-qa.p12"

          # Expo prebuild signs its template release with a shared debug key.
          # Always realign and replace that signature for a portable QA handoff.
          "$zipalign" -P 16 -f -v 4 "$source_apk" "$aligned_apk"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$qa_keystore" \
            -storepass android \
            -keypass android \
            -alias qa \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 3650 \
            -dname "CN=Grocery Benefits Tracker QA,OU=QA,O=Good Use Studios,L=Test,ST=Test,C=US"
          certificate_report="$(keytool -list -v \
            -storetype PKCS12 \
            -keystore "$qa_keystore" \
            -storepass android \
            -alias qa)"
          grep -F "Signature algorithm name: SHA256withRSA" <<<"$certificate_report"
          "$apksigner" sign \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --ks "$qa_keystore" \
            --ks-key-alias qa \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$final_apk" \
            "$aligned_apk"

          "$zipalign" -c -P 16 -v 4 "$final_apk"
          legacy_signature_report="$($apksigner verify \
            --verbose \
            --min-sdk-version 23 \
            --max-sdk-version 23 \
            "$final_apk")"
          printf '%s\n' "$legacy_signature_report"
          grep -F "Verified using v1 scheme (JAR signing): true" <<<"$legacy_signature_report"
          signature_report="$($apksigner verify \
            --verbose \
            --print-certs \
            --min-sdk-version 24 \
            "$final_apk")"
          printf '%s\n' "$signature_report"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" <<<"$signature_report"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$signature_report"
          badging="$($aapt dump badging "$final_apk")"
          grep -F "package: name='com.lateefrazaqoyetola.snapebtwictracker.qa'" <<<"$badging"
          grep -F "targetSdkVersion:'36'" <<<"$badging"
          node scripts/verify-android.mjs "$final_apk"
          (
            cd dist
            sha256sum "$(basename "$final_apk")" | tee SHA256SUMS.txt
          )
          echo "path=$final_apk" >> "$GITHUB_OUTPUT"

      # Preserve a fully validated APK even if the hosted emulator itself is unavailable.
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: grocery-benefits-tracker-qa-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.path }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM is unavailable; the emulator runner will use its safe fallback."
          fi

      - name: Prove APK installs on Android 15
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-linux-hw-accel: auto
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -partition-size 1536
          script: bash scripts/prove-android-install.sh
