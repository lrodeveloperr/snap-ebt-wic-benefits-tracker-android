name: Capture Grocery QA APK run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-apk-run.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    name: Record triggered Android QA run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Android QA workflow run for this commit
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-qa-apk.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10"
          run_id=""
          run_url=""
          for attempt in {1..24}; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            run_id="$(printf '%s' "$response" | jq -r '.workflow_runs[0].id // empty')"
            run_url="$(printf '%s' "$response" | jq -r '.workflow_runs[0].html_url // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Could not resolve the Android QA run ID." >&2; exit 1; }
          printf '{"run_id":%s,"head_sha":"%s","run_url":"%s"}\n' "$run_id" "$GITHUB_SHA" "$run_url" > .github/last-apk-run.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Persist run pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-apk-run.json
          git commit -m "Record Grocery QA APK run ${{ steps.run.outputs.run_id }}"
          git push origin HEAD:main
