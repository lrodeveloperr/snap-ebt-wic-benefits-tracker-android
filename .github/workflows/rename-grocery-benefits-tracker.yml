name: One-time Grocery Benefits Tracker rename

on:
  push:
    paths:
      - .github/workflows/rename-grocery-benefits-tracker.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rename public app identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          replacements = [
              ("SNAP-EBT & WIC Benefits Tracker", "Grocery Benefits Tracker"),
              ("SNAP-EBT WIC Benefits Tracker", "Grocery Benefits Tracker"),
              ("SNAP-EBT-WIC-Benefits-Tracker", "Grocery-Benefits-Tracker"),
              ("SNAP-EBT-WIC-production-AAB", "Grocery-Benefits-Tracker-production-AAB"),
              ("snap-wic-benefits-tracker-report", "grocery-benefits-tracker-report"),
              ("snap-ebt-wic-benefits-tracker-report", "grocery-benefits-tracker-report"),
              ("reporte-snap-ebt-wic-benefits-tracker", "reporte-grocery-benefits-tracker"),
          ]

          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(raw.decode())
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for before, after in replacements:
                  updated = updated.replace(before, after)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          app_path = Path("app.json")
          app = json.loads(app_path.read_text(encoding="utf-8"))
          app["expo"]["name"] = "Grocery Benefits Tracker"
          app_path.write_text(json.dumps(app, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run embed:web
      - run: npm run validate
      - name: Verify rename
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'SNAP-EBT[[:space:]]*&?[[:space:]]*WIC Benefits Tracker|SNAP-EBT-WIC-Benefits-Tracker' -- . ':(exclude).github/workflows/rename-grocery-benefits-tracker.yml'; then
            exit 1
          fi
          grep -F '"name": "Grocery Benefits Tracker"' app.json
          grep -F 'config.name !== "Grocery Benefits Tracker"' .github/workflows/android-production-aab.yml
          grep -F '"package": "com.lateefrazaqoyetola.snapebtwictracker"' app.json
      - name: Commit rename
        shell: bash
        run: |
          git config user.name "GoodUse Studios Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rename app to Grocery Benefits Tracker"
          git push origin HEAD:main
